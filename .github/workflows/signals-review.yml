name: Signals review

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade 'pip<26' && python -m pip install .
      - name: Regression corpus
        run: python -m hermes_signals.cli corpus
      - name: Scan trace artifact (if present)
        run: python -m hermes_signals.cli scan trace.json --output json
        if: hashFiles('trace.json') != ''
