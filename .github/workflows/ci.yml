name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade 'pip<26' && python -m pip install '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python -m hermes_signals.cli demo --output json
